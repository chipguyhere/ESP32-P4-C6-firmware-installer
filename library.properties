name=chipguy_ESP32-P4-C6-firmware-installer
version=0.3.0
author=chipguyhere
maintainer=chipguyhere
sentence=One-time firmware installer for the Guition JC8012P4A1C and Waveshare ESP32-P4-86-Panel: the JC8012's touch firmware, and the ESP32-C6 radio's ESP-Hosted firmware.
paragraph=Upload the InstallFirmware example and follow the screen. On the JC8012P4A1C it stores the GSL3680 touch controller's firmware in NVS, where the display libraries load it at power-up; on both boards it offers to update the ESP32-C6 to the ESP-Hosted version the Arduino core expects (never to an older one). On other ESP32-P4 boards it runs serial-only, at your own risk. No warranty. Mixed license: touch firmware GPL v2 (Silead), C6 firmware Apache 2.0 (Espressif), installer code MIT.
category=Other
url=https://github.com/chipguyhere/ESP32-P4-C6-firmware-installer
architectures=esp32
includes=ESP32P4C6_FirmwareInstaller.h
depends=chipguy_P486_or_JC8012_display, lvgl
