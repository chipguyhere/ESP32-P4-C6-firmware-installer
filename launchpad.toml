# ESP Launchpad (minimal) configuration for the ESP32-P4 C6 firmware installer,
# generated by release/build.sh from release/launchpad.toml.in.  Open it with
# chipguyhere's launchpad (it asks before flashing, and honors erase_all):
#   https://chipguyhere.github.io/esp-launchpad/minimal-launchpad/?flashConfigURL=<this file's raw URL>
# Every URL here must send CORS headers: raw.githubusercontent.com does,
# GitHub release downloads don't.
esp_toml_version = 1.0
supported_apps = ["ESP32-P4 C6 firmware installer"]
multipart = true
chip = "esp32p4"

["ESP32-P4 C6 firmware installer"]
readme.text = "https://raw.githubusercontent.com/chipguyhere/ESP32-P4-C6-firmware-installer/main/README.md"
console_baudrate = 115200
# Write only these four parts: NVS (0x9000) is kept, so the touch firmware and
# any sketch's saved settings survive.  (Espressif's own launchpad ignores this
# and erases the whole chip.)
erase_all = false
# The InstallFirmware sketch, version 0.3.0: bootloader, partition table, otadata, app.
image.esp32p4.parts = [
  "https://raw.githubusercontent.com/chipguyhere/ESP32-P4-C6-firmware-installer/main/web-install/bootloader.bin",
  "https://raw.githubusercontent.com/chipguyhere/ESP32-P4-C6-firmware-installer/main/web-install/partitions.bin",
  "https://raw.githubusercontent.com/chipguyhere/ESP32-P4-C6-firmware-installer/main/web-install/boot_app0.bin",
  "https://raw.githubusercontent.com/chipguyhere/ESP32-P4-C6-firmware-installer/main/web-install/installer.bin",
]
image.esp32p4.addresses = ["0x2000", "0x8000", "0xe000", "0x10000"]
